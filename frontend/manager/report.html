<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <div class="page-panel">
      <div class="header-row">
        <h2>📈 Library Report</h2>
        <div><a class="secondary-btn" href="dashboard.html">← Back</a></div>
      </div>

      <div class="card-grid" style="margin-top: 24px;">
        <div class="page-panel" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); border-left: 4px solid var(--primary);">
          <h3 style="margin-top: 0;">👥 Total Users</h3>
          <p style="font-size: 2.5em; margin: 0; color: var(--primary); font-weight: bold;">12</p>
        </div>
        <div class="page-panel" style="background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%); border-left: 4px solid var(--warning);">
          <h3 style="margin-top: 0; color: var(--warning);">📚 Total Books</h3>
          <p style="font-size: 2.5em; margin: 0; color: var(--warning); font-weight: bold;">200</p>
        </div>
        <div class="page-panel" style="background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%); border-left: 4px solid var(--danger);">
          <h3 style="margin-top: 0; color: var(--danger);">📤 Borrowed Books</h3>
          <p style="font-size: 2.5em; margin: 0; color: var(--danger); font-weight: bold;">18</p>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
