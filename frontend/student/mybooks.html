<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Borrowed Books</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <div class="page-panel">
      <div class="header-row">
        <h2>📖 My Borrowed Books</h2>
        <div><a class="secondary-btn" href="dashboard.html">← Back</a></div>
      </div>

      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>📚 Title</th>
              <th>📅 Borrow Date</th>
              <th>⏰ Due Date</th>
              <th>📊 Status</th>
              <th>⚡ Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Example Book A</strong></td>
              <td>2026-05-01</td>
              <td>2026-05-21</td>
              <td><span style="background: rgba(99, 102, 241, 0.2); color: var(--primary); padding: 4px 8px; border-radius: 6px;">📥 Borrowed</span></td>
              <td><button class="btn" style="padding: 6px 12px; font-size: 0.9em;">↩️ Return</button></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</body>
</html>
