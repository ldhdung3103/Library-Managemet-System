<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <div class="page-panel">
      <div class="header-row">
        <h2>🎓 Student Dashboard</h2>
        <div><a class="secondary-btn" href="../index.html">🏠 Home</a></div>
      </div>
      <p class="muted" style="font-size: 1em;">Welcome! Browse books and manage your library loans.</p>

      <div class="card-grid">
        <div class="page-panel" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%); border-left: 4px solid var(--primary);">
          <h3 style="margin-top: 0;">📚 Quick Links</h3>
          <a href="books.html">🔍 Browse Books</a>
          <a href="mybooks.html">📖 My Borrowed Books</a>
        </div>

        <div class="page-panel" style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%); border-left: 4px solid var(--success);">
          <h3 style="margin-top: 0; color: var(--success);">✅ Status</h3>
          <p class="muted">You have <strong style="color: var(--success);">0</strong> overdue books.</p>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
