<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Library</title>
  <script src="js/base-path.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-shell" data-page="login">
  <div class="login-card">
    <h2>📚 Library Login</h2>
    <p class="muted">Sign in with your library account</p>

    <div id="loginError" class="error" style="display:none;margin-bottom:12px;text-align:center;color:#dc2626;"></div>

    <form id="loginForm" action="../login" method="post">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. student1" required autocomplete="username">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="display:flex;gap:12px;align-items:center">
        <button class="form-button" type="submit">Sign in</button>
        <a class="secondary-btn" href="index.html">Cancel</a>
      </div>
    </form>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
