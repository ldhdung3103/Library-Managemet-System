<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports</title>

  <script src="../js/base-path.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-page="manager-report">

  <div class="container">
    <div class="page-panel">

      <div class="header-row">
        <h2>📈 Library Report</h2>

        <!-- giữ nguyên user + logout -->
        <div id="userBar">
          👋 System Manager
          <a class="secondary-btn" href="../logout">Logout</a>
        </div>
      </div>

      <div class="card-grid" id="reportGrid" style="margin-top:24px;">

        <div class="card">
          <h3>👥 Total Users</h3>
          <p>4</p>
        </div>

        <div class="card">
          <h3>📚 Total Books</h3>
          <p>4</p>
        </div>

        <div class="card">
          <h3>📤 Borrowed Books</h3>
          <p>1</p>
        </div>

        <div class="card">
          <h3>📝 Pending Requests</h3>
          <p>0</p>
        </div>

        <div class="card">
          <h3>⏰ Overdue Books</h3>
          <p>0</p>
        </div>

        <div class="card">
          <h3>💰 Total Penalties</h3>
          <p>$0</p>
        </div>

      </div>

      <p style="margin-top:16px;">
        <a class="secondary-btn" href="dashboard.html">← Back</a>
      </p>

    </div>
  </div>

</body>
</html>
