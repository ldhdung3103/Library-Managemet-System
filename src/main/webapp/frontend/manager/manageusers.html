<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Users</title>
  <script src="../js/base-path.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="manager-users">
  <div class="container">
    <div class="page-panel">
      <div class="header-row">
        <h2>👥 Manage Users</h2>
        <div id="userBar"></div>
      </div>

      <div class="page-panel" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%); border: 2px dashed rgba(99, 102, 241, 0.3);">
        <h3 style="margin-top: 0; color: var(--primary);">➕ Add New User</h3>
        <form action="../../manageusers" method="post">
          <input type="hidden" name="action" value="add">
          <div class="input-group">
            <div>
              <label>Username *</label>
              <input name="username" placeholder="username" required>
            </div>
            <div>
              <label>Password *</label>
              <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div>
              <label>Full Name *</label>
              <input name="fullName" placeholder="Full name" required>
            </div>
            <div>
              <label>Email *</label>
              <input type="email" name="email" placeholder="email@example.com" required>
            </div>
            <div>
              <label>Role *</label>
              <select name="role" required>
                <option value="">-- Select role --</option>
                <option value="student">🎓 Student</option>
                <option value="librarian">📋 Librarian</option>
                <option value="manager">👔 Manager</option>
              </select>
            </div>
            <div style="display:flex;gap:10px">
              <button type="submit" class="btn">✅ Add User</button>
              <button type="reset" class="secondary-btn">Clear</button>
            </div>
          </div>
        </form>
      </div>

      <div style="margin-top: 32px;">
        <h3 style="color: var(--primary); margin-bottom: 16px;">👥 System Users</h3>
        <div class="table-wrapper">
          <table class="table" id="usersTable">
            <thead>
              <tr>
                <th>🆔 ID</th>
                <th>👤 Username</th>
                <th>📧 Email</th>
                <th>👔 Role</th>
                <th>📊 Status</th>
                <th>⚡ Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <p style="margin-top:16px;"><a class="secondary-btn" href="dashboard.html">← Back</a></p>
    </div>
  </div>
  <script src="../js/app.js" defer></script>
</body>
</html>
