<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Books</title>
  <script src="../js/base-path.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="librarian-managebooks">
  <div class="container">
    <div class="page-panel">
      <div class="header-row">
        <h2>📖 Manage Books</h2>
        <div id="userBar"></div>
      </div>

      <div class="page-panel" style="background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%); border: 2px dashed rgba(99, 102, 241, 0.3);">
        <h3 style="margin-top: 0; color: var(--primary);">Add New Book</h3>
        <form action="../../managebooks" method="post">
          <input type="hidden" name="action" value="add">
          <div class="input-group">
            <div>
              <label>Title *</label>
              <input name="title" placeholder="Enter book title" required>
            </div>
            <div>
              <label>Author *</label>
              <input name="author" placeholder="Enter author name" required>
            </div>
            <div>
              <label>Category *</label>
              <input name="category" placeholder="e.g., Science, Fiction" required>
            </div>
            <div>
              <label>ISBN</label>
              <input name="isbn" placeholder="Optional">
            </div>
            <div>
              <label>Quantity *</label>
              <input name="quantity" type="number" min="1" value="1" required>
            </div>
            <div style="display:flex;gap:10px">
              <button type="submit" class="btn">+ Add Book</button>
              <button type="reset" class="secondary-btn">Clear</button>
            </div>
          </div>
        </form>
      </div>

      <div style="margin-top: 32px;">
        <h3 style="color: var(--primary); margin-bottom: 16px;">📚 Book Inventory</h3>
        <div class="table-wrapper">
          <table class="table" id="inventoryTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Available</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <p style="margin-top:16px;"><a class="secondary-btn" href="dashboard.html">← Back</a></p>
    </div>
  </div>
  <script src="../js/app.js" defer></script>
</body>
</html>
